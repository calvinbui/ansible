---

- hosts: homeserver

  vars:
    application: ownfoil

    container_network: "{{ networks.iot }}"

  handlers:
    - name: Restart
      containers.podman.podman_container:
        name: "{{ application }}"
        force_restart: true
      no_log: true

  tasks:
    - name: Create config folder
      ansible.builtin.file:
        path: "{{ config_directory }}"
        state: directory
        owner: "{{ common_user }}"
        group: "{{ common_group }}"
        mode: "0771"

    - name: Create settings.yaml
      ansible.builtin.copy:
        content: |
          server:
            uid: 707f36ad5bee428f8f740462e11a9bdd
          shop:
            clients:
              tinfoil:
                encrypt: false
            host: ownfoil.{{ common_local_tld }}:8465
            public: true
        dest: "{{ config_directory }}/settings.yaml"
        mode: "0644"

    - name: Copy prod.keys
      ansible.builtin.copy:
        src: "{{ files_directory }}/prod.keys"
        dest: "{{ config_directory }}/keys.txt"
        mode: "0644"

    - name: Create container
      ansible.builtin.include_role:
        name: podman_container
      vars:
        image: docker.io/a1ex4/ownfoil:2.5.0
        ip: "{{ container_network.subnet | ansible.utils.nthhost(105) }}"
        volumes:
          - "{{ config_directory }}:/app/config"
          - "{{ common_directory_games }}/Switch/Games:/games:ro"
        blackbox:
          protocol: http
          host: "{{ application }}.{{ common_local_tld }}:8465"
          path: /
        homepage:
          name: Ownfoil
          group: Gaming
          icon: /icons/tinfoil.png
          description: Nintendo Switch Games
          href: http://tinfoil.{{ common_local_tld }}:8465
          weight: 900
          monitor: true
