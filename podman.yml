---

- hosts: homeserver

  vars:
    application: podman

    # Stop these together before the remaining containers, keeping dependencies available.
    podman_shutdown_first_containers:
      - home-assistant
      - plex-auto-languages
      - tracearr
      - traefik
      - otf
      - watchyourlan

  handlers:
    - name: Restart podman
      ansible.builtin.systemd:
        name: podman
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install podman
      ansible.builtin.apt:
        name: podman
        state: present
        default_release: sid
        update_cache: true
        cache_valid_time: 86400

    - name: Set sid repository priority
      ansible.builtin.copy:
        dest: "/etc/apt/preferences.d/{{ application }}"
        content: |
          Package: podman
          Pin: release n=sid
          Pin-Priority: 900
        owner: root
        group: root
        mode: "0644"

    - name: Install python3-podman
      ansible.builtin.apt:
        name: python3-podman
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Create networks
      containers.podman.podman_network:
        name: "{{ item.key }}"
        driver: macvlan
        interface_name: "vlan{{ item.value.vlan }}"
      loop: "{{ networks | ansible.builtin.dict2items }}"
      when:
        - item.value.vlan is defined
        - item.value.dhcp_pool is defined

    - name: Create a script to alias podman to 'sudo podman' for all users
      ansible.builtin.copy:
        content: |
          # using macvlan requires sudo for all podman commands
          alias podman='sudo podman'
        dest: /etc/profile.d/99-podman_alias.sh
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start the podman.socket service
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    - name: Create override directory for podman.service service
      ansible.builtin.file:
        path: /etc/systemd/system/podman.service.d/
        state: directory
        mode: "0755"

    - name: Override podman.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman.service.d/override.conf
        content: |
          [Service]
          # Clear the existing LOGGING variable
          Environment=LOGGING=
          # Set the new LOGGING variable
          Environment=LOGGING="--log-level=warn"
        mode: "0644"
      notify: Restart podman

    - name: Create override directory for podman-restart.service
      ansible.builtin.file:
        path: /etc/systemd/system/podman-restart.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep Podman shutdown dependencies available during container cleanup
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-restart.service.d/shutdown-ordering.conf
        content: |
          [Unit]
          Wants=dbus.service netavark-dhcp-proxy.service
          After=dbus.service netavark-dhcp-proxy.service
          # Keep the API available until its container event-stream clients exit.
          After=podman.service podman.socket
          # Keep the optional backup disk mounted through container cleanup.
          After=mnt-borg\x2dusb.mount
        owner: root
        group: root
        mode: "0644"

    - name: Stop application clients before their shutdown dependencies
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-restart.service.d/application-shutdown.conf
        content: |
          [Service]
          # Close proxy connections and applications while databases and Plex remain up.
          ExecStop=
          {% if podman_shutdown_first_containers %}
          ExecStop=-/usr/bin/podman $LOGGING stop --service --ignore {{ podman_shutdown_first_containers | ansible.builtin.join(' ') }}
          {% endif %}
          # Always finish with the vendor's bulk stop, even if the first pass fails.
          ExecStop=/usr/bin/podman $LOGGING stop --service --all
        owner: root
        group: root
        mode: "0644"

    - name: Keep Podman shutdown hook armed after container startup errors
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-restart.service.d/startup-tolerance.conf
        content: |
          [Service]
          # Preserve the shutdown hook when the bulk container start fails.
          ExecStart=
          ExecStart=-/usr/bin/podman $LOGGING start --all --filter should-start-on-boot=true
        owner: root
        group: root
        mode: "0644"

    - name: Create override directory for machine.slice
      ansible.builtin.file:
        path: /etc/systemd/system/machine.slice.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Let Podman manage container shutdown without competing scope stops
      ansible.builtin.copy:
        dest: /etc/systemd/system/machine.slice.d/podman-shutdown.conf
        content: |
          [Unit]
          # Podman's scopes already disable default shutdown dependencies.
          # Do not stop their parent slice concurrently with podman-restart.service.
          DefaultDependencies=no
        owner: root
        group: root
        mode: "0644"

    - name: Enable podman-restart service
      ansible.builtin.systemd_service:
        name: podman-restart.service
        enabled: true
        daemon_reload: true

    - name: Create containers.conf
      ansible.builtin.copy:
        content: |
          [engine]
          healthcheck_events = true

          [containers]
          base_hosts_file = "image"

          default_sysctls = [
            # from default config
            "net.ipv4.ping_group_range=0 0",

            # disable ipv6
            "net.ipv6.conf.all.disable_ipv6=1",
            "net.ipv6.conf.default.disable_ipv6=1"
          ]
        dest: /etc/containers/containers.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart podman

    - name: Prune images daily
      ansible.builtin.cron:
        name: "podman image prune"
        hour: "1"
        minute: "0"
        job: "podman image prune --filter 'label!=skip.prune=true' --all --force > /dev/null 2>&1"

    - name: Generate Podman bash completion script
      ansible.builtin.command:
        cmd: podman completion -f /etc/bash_completion.d/podman bash
        creates: /etc/bash_completion.d/podman
