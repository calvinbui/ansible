---

- hosts: homeserver

  vars:
    application: flaresolverr

    container_network: "{{ networks.pub }}"

  tasks:
    - name: Create container
      ansible.builtin.include_role:
        name: podman_container
      vars:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        env:
          TEST_URL: "https://{{ common_tld }}"
          TZ: "{{ common_timezone }}"
        blackbox:
          protocol: http
          host: "{{ application }}.{{ common_local_tld }}:8191"
          path: /health
