---

title: Solar
path: solar
icon: mdi:solar-power-variant

type: custom:grid-layout
layout:
  grid-template-columns: 70% 30%
  align-items: start
  grid-template-areas: |
    "left right"
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: 100%
      grid-template-areas: |
        "left"
        "right"

cards:
  -
    view_layout:
      grid-area: left
    type: vertical-stack
    cards:
      -
        type: 'custom:config-template-card'
        entities:
          - sensor.home_sun_rising
          - sensor.home_sun_setting
          - input_number.solar_graph_offset
        variables:
          getDate: |
            sensor => {
              var event_date = new Date();

              event_date.setDate(event_date.getDate() - states['input_number.solar_graph_offset'].state);

              return event_date.toLocaleDateString('en-AU', {dateStyle: 'full'});
            }
          getTime: |
            sensor => {
              const today = new Date();

              var event_time = new Date(states[sensor].state);

              if (event_time.getDate() == today.getDate()) {
                return event_time.getTime();
              }

              return 0;
            }
          getTimeString: |
            sensor => {
              const today = new Date();

              var event_time = new Date(states[sensor].state);

              if (event_time.getDate() == today.getDate()) {
                return event_time.toLocaleTimeString('en-AU', {hour: '2-digit', minute: '2-digit'});
              }

              return "";
            }
        card:
          type: custom:apexcharts-card
          update_interval: 30sec

          graph_span: 24h
          span:
            start: day
            offset: >-
              ${(Number(states['input_number.solar_graph_offset'].state) > 0 ? "-" : "+") + Math.abs(Number(states['input_number.solar_graph_offset'].state)) + "d"}

          show:
            loading: true
            last_updated: false

          hours_12: true

          cache: true

          stacked: true

          header:
            show: true
            title: ${getDate('') }
            show_states: true
            colorize_states: true
            disable_actions: true

          apex_config:
            # The card's own `yaxis` option gives every series a separate
            # ApexCharts axis, and ApexCharts only stacks series sharing an
            # axis, so the axes are defined here by series name instead.
            # Forecast gets its own hidden axis so it isn't stacked; its
            # min/max must match the kW axis.
            yaxis:
              -
                seriesName:
                  - Grid Consumption
                  - Solar Usage
                  - Battery Usage
                  - Solar Battery Charging
                  - Solar Export
                  - Battery Export
                min: 0
                max: 10
                tickAmount: 5
                decimalsInFloat: 0
              -
                seriesName: Battery Charge
                opposite: true
                min: 0
                max: 100
                tickAmount: 5
                decimalsInFloat: 0
              -
                seriesName: Forecast
                show: false
                min: 0
                max: 10
              -
                # Separate from Battery Charge so the two aren't stacked
                seriesName: Battery Forecast
                show: false
                min: 0
                max: 100
            theme:
              mode: dark
            tooltip:
              x:
                format: h:mm TT
            chart:
              type: area
              background: transparent
              # Without this, mixed area/line charts only stack columns
              stackOnlyBar: false
              zoom:
                enabled: true
                type: x
              toolbar:
                show: true
                tools:
                  reset: true
                  pan: true
                  download: false
                  selection: false
                  zoom: false
                  zoomin: true
                  zoomout: true
            stroke:
              show: true
            dataLabels:
              enabled: true
            legend:
              show: false
            # Gradient fills apply the series opacity twice in ApexCharts 5
            fill:
              type: solid
            grid:
              show: false
            annotations:
              xaxis:
                -
                  x: "${getTime('sensor.home_sun_rising')}"
                  strokeDashArray: 2
                  label:
                    text: "${'☀️ Sunrise - ' + getTimeString('sensor.home_sun_rising')}"
                    borderWidth: 0
                    style:
                      background: '#0000'
                -
                  x: "${getTime('sensor.home_sun_setting')}"
                  strokeDashArray: 2
                  label:
                    text: "${'🌙 Sunset - ' + getTimeString('sensor.home_sun_setting')}"
                    borderWidth: 0
                    style:
                      background: '#0000'

          locale: en

          # The card fills toolbar icons, but ApexCharts 5 icons are outlines
          card_mod:
            style: |
              .apexcharts-toolbar svg {
                fill: none !important;
              }

          all_series_config:
            type: area
            stroke_width: 2
            curve: smooth
            opacity: 0.75
            unit: kW
            fill_raw: last
            extend_to: now
            show:
              legend_value: true
              in_header: false
              in_chart: true
          series:
            -
              name: Grid Consumption
              entity: sensor.grid_power_consumption
              color: '#f76354' # red
              transform: return x / 1000;
              float_precision: 3
              group_by:
                func: avg
                duration: 5m
            -
              # Must stay second: the card places extrema markers on the
              # y-axis whose index equals the series index (the % axis).
              name: Battery Charge
              entity: sensor.solplanet_battery_al010k5sq2590170_battery_state_of_charge
              type: line
              stroke_width: 5
              color: '#ffa500'
              unit: '%'
              show:
                extremas: true
            -
              name: Solar Usage
              entity: sensor.solar_direct_home_consumption
              transform: return x / 1000;
              color: '#ff9800'
              group_by:
                func: avg
                duration: 5m
            -
              # Excludes battery discharge to the grid, shown as Battery Export
              name: Battery Usage
              entity: sensor.battery_discharge_self_consumption
              transform: return x / 1000;
              color: '#4db6ac'
              group_by:
                func: avg
                duration: 5m
            -
              name: Solar Battery Charging
              entity: sensor.solar_battery_charging
              transform: return x / 1000;
              color: '#f06292'
              group_by:
                func: avg
                duration: 5m
            -
              # Grid export minus Battery Export, built from the history of
              # both so past days work (transform doesn't apply to generators).
              # Averaged into 5-minute buckets here because the card's group_by
              # fills generated series all the way to the end of the span.
              name: Solar Export
              entity: sensor.grid_power_export
              color: '#18cf87'
              data_generator: |
                const exportId = 'sensor.grid_power_export';
                const batteryId = 'sensor.battery_discharge_to_grid';
                const history = await hass.callWS({
                  type: 'history/history_during_period',
                  start_time: start.toISOString(),
                  end_time: end.toISOString(),
                  entity_ids: [exportId, batteryId],
                  minimal_response: true,
                  no_attributes: true,
                  significant_changes_only: false,
                });

                const changes = [exportId, batteryId]
                  .flatMap((entityId) =>
                    (history[entityId] ?? []).map((item) => ({
                      entityId,
                      time: Math.max(item.lu * 1000, start.getTime()),
                      value: parseFloat(item.s),
                    }))
                  )
                  .sort((a, b) => a.time - b.time);

                const current = {};
                const points = changes.map(({ entityId, time, value }) => {
                  current[entityId] = Number.isNaN(value) ? null : value;
                  const exported = current[exportId];
                  if (exported === null || exported === undefined) return [time, null];
                  return [time, Math.max(exported - (current[batteryId] ?? 0), 0) / 1000];
                });

                const STEP = 5 * 60 * 1000;
                const last = Math.min(Date.now(), end.getTime());
                const buckets = [];
                let index = 0;
                let previous = null;
                for (let t = start.getTime(); t <= last; t += STEP) {
                  const values = [];
                  while (index < points.length && points[index][0] < t + STEP) {
                    values.push(points[index++][1]);
                  }
                  const known = values.filter((value) => value !== null);
                  if (known.length) {
                    previous = known.reduce((a, b) => a + b, 0) / known.length;
                  } else if (values.length) {
                    previous = null;
                  }
                  buckets.push([t, previous]);
                }
                return buckets;
            -
              name: Battery Export
              entity: sensor.battery_discharge_to_grid
              transform: return x / 1000;
              color: '#9575cd'
              group_by:
                func: avg
                duration: 5m
            -
              name: Forecast
              # Keep the chart renderable while Solcast is unavailable; the
              # generated data is read from the Solcast entities below.
              entity: sensor.total_solar_generation
              type: line
              color: '#3798fe'
              curve: stepline
              extend_to: end
              data_generator: |
                // config-template-card only passes new states to this card when
                // its own entities change, so read them from the live frontend
                hass = document.querySelector('home-assistant')?.hass ?? hass;

                const forecastEntities = [
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_forecast_day_3',
                  'sensor.solcast_pv_forecast_forecast_day_4',
                  'sensor.solcast_pv_forecast_forecast_day_5',
                  'sensor.solcast_pv_forecast_forecast_day_6',
                  'sensor.solcast_pv_forecast_forecast_day_7',
                ];

                return forecastEntities
                  .flatMap((entityId) => {
                    const detailedForecast =
                      hass.states[entityId]?.attributes?.detailedForecast;
                    return Array.isArray(detailedForecast) ? detailedForecast : [];
                  })
                  .map((entry) => {
                    const timestamp = new Date(entry.period_start).getTime();
                    return [timestamp, Math.min(entry.pv_estimate, 10)];
                  })
                  .filter(([timestamp]) =>
                    timestamp >= start.getTime() && timestamp <= end.getTime()
                  );
            -
              name: Battery Forecast
              entity: sensor.solplanet_battery_al010k5sq2590170_battery_state_of_charge
              type: line
              stroke_width: 3
              stroke_dash: 6
              curve: smooth
              color: '#ffa500'
              unit: '%'
              extend_to: false
              # Simulates SOC from now until 17:00 the day after tomorrow in
              # 5-minute steps (use Next Day to see the next two days) using the
              # Solcast P50 forecast,
              # the household load for each hour of the day (7-day average,
              # excluding car charging, with night hours scaled to the typical
              # measured overnight drop like the export plan), Zeekr charging at
              # 2.3 kW while it is home, plugged in and below its limit and solar
              # covers the house plus the car, and the AGL 17:00-21:00 export
              # pacing down to sensor.battery_export_target (captured into
              # input_number.agl_export_target_soc at 17:00). Tomorrow evening's
              # target is worked out in planTarget with the same rules as the
              # export plan, from the day-after forecast. Battery constants come from the Zeekr Battery Forecast
              # Model calibration (9.65 kW DC charges ~18 %/h, 90.5% conversion
              # efficiency).
              data_generator: |
                // config-template-card only passes new states to this card when
                // its own entities change, so read them from the live frontend
                hass = document.querySelector('home-assistant')?.hass ?? hass;

                const now = Date.now();
                const startSoc = Number(hass.states[entity.entity_id]?.state);
                const atHour = (hour, days = 0) => {
                  const date = new Date(now);
                  date.setDate(date.getDate() + days);
                  return date.setHours(hour, 0, 0, 0);
                };
                const horizon = atHour(17, 2);
                if (end.getTime() <= now || start.getTime() >= horizon || !Number.isFinite(startSoc)) {
                  return [];
                }

                const num = (entityId, fallback) => {
                  const value = Number(hass.states[entityId]?.state);
                  return Number.isFinite(value) ? value : fallback;
                };

                const CAPACITY_KWH = 53.6;
                const EFFICIENCY = 0.905;
                const MAX_CHARGE_KW = 9.65;
                const MAX_DISCHARGE_KW = 10;
                const STEP = 5 * 60 * 1000;
                const PLOT_EVERY = 30 * 60 * 1000;
                const minSoc = num('number.solplanet_battery_al010k5sq2590170_soc_min', 5);
                const maxSoc = num('number.solplanet_battery_al010k5sq2590170_soc_max', 100);

                // Refreshed hourly rather than on every 30s chart update
                const cached = window.batteryForecastLoadProfile;
                let profile = cached && now - cached.fetched < 60 * 60 * 1000 ? cached.profile : null;
                if (!profile) {
                  const home = 'sensor.home_power_consumption';
                  const car = 'sensor.garage_zeekr_7x_awd_charge_power';
                  const stats = await hass.callWS({
                    type: 'recorder/statistics_during_period',
                    start_time: new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString(),
                    end_time: new Date(now).toISOString(),
                    statistic_ids: [home, car],
                    period: 'hour',
                    types: ['mean'],
                  });
                  const carKw = new Map(
                    (stats[car] ?? []).map((s) => [new Date(s.start).getTime(), s.mean ?? 0])
                  );
                  const sums = Array(24).fill(0);
                  const counts = Array(24).fill(0);
                  for (const s of stats[home] ?? []) {
                    if (s.mean == null) continue;
                    const timestamp = new Date(s.start).getTime();
                    const hour = new Date(timestamp).getHours();
                    sums[hour] += Math.max(s.mean / 1000 - (carKw.get(timestamp) ?? 0), 0);
                    counts[hour]++;
                  }
                  profile = sums.map((sum, hour) => (counts[hour] ? sum / counts[hour] : null));
                  window.batteryForecastLoadProfile = { fetched: now, profile };
                }
                const knownLoads = profile.filter((load) => load !== null);
                const fallbackLoad = knownLoads.length
                  ? knownLoads.reduce((a, b) => a + b, 0) / knownLoads.length
                  : 1.2;

                // Night hours (21:00-07:00) scaled to the measured overnight drops, like
                // the export plan: typical for the line and the refill, largest for the floor
                const loadProfile = hass.states['sensor.house_load_profile']?.attributes ?? {};
                const nightAvgKwh = Number(loadProfile.night_avg_kwh);
                const nightFactorFor = (dropPct) => nightAvgKwh > 0 && dropPct > 0
                  ? (dropPct / 100) * CAPACITY_KWH * EFFICIENCY / nightAvgKwh
                  : 1;
                const nightFactor = nightFactorFor(Number(loadProfile.night_drop_avg_pct));
                const nightFactorMax = nightFactorFor(Number(loadProfile.night_drop_max_pct)) || nightFactor;
                const loadAt = (timestamp, factor = nightFactor) => {
                  const hour = new Date(timestamp).getHours();
                  const load = profile[hour] ?? fallbackLoad;
                  return hour >= 21 || hour < 7 ? load * factor : load;
                };
                const batteryPct = (net, hours) =>
                  ((net >= 0 ? Math.min(net, MAX_CHARGE_KW) * EFFICIENCY : Math.max(net, -MAX_DISCHARGE_KW) / EFFICIENCY)
                    * hours / CAPACITY_KWH) * 100;

                // Zeekr: 2.3 kW from solar only, while it still needs energy to reach its limit
                const CAR_KW = 2.3;
                const carLevel = num('sensor.garage_zeekr_7x_awd_battery_level', 100);
                const carLimit = num('number.garage_zeekr_7x_awd_charging_limit', 0);
                let carNeededKwh =
                  hass.states['device_tracker.garage_zeekr_7x_awd_location']?.state === 'home' &&
                  hass.states['binary_sensor.garage_zeekr_7x_awd_plugged_in']?.state === 'on'
                    ? Math.max(carLimit - carLevel, 0) / 0.9
                    : 0;

                // Half-hourly Solcast P50 and P90, today to four days out
                const HALF_HOUR = 30 * 60 * 1000;
                const solar = new Map();
                for (const entityId of [
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_forecast_day_3',
                  'sensor.solcast_pv_forecast_forecast_day_4',
                ]) {
                  for (const entry of hass.states[entityId]?.attributes?.detailedForecast ?? []) {
                    solar.set(new Date(entry.period_start).getTime(), {
                      p50: Number(entry.pv_estimate) || 0,
                      p90: Number(entry.pv_estimate90) || 0,
                    });
                  }
                }
                const solarAt = (timestamp, field = 'p50') =>
                  solar.get(Math.floor(timestamp / HALF_HOUR) * HALF_HOUR)?.[field] ?? 0;

                // Same rules as battery_export_plan (custom_templates/battery_export.jinja), for an
                // evening whose target has not been captured yet: the highest of refilling to 90% by
                // 17:00 the next day (P50/P90 midpoint, typical night, car allowance), the morning
                // low 5 points above SOC min (largest night) and the two-day check.
                const planTarget = (evening, carNeed) => {
                  const floor = minSoc;
                  const carAllowance = carNeed * 0.9 >= 10 ? carNeed : 0;
                  let typical = 0;
                  let worst = 0;
                  let low = 0;
                  let carUsed = 0;
                  const steps = [];
                  for (let i = 0; i < 88; i++) {
                    const t = evening + i * HALF_HOUR;
                    const firstDay = i < 40;
                    const pv = firstDay ? (solarAt(t, 'p50') + solarAt(t, 'p90')) / 2 : solarAt(t, 'p50');
                    const loadWorst = loadAt(t, nightFactorMax);
                    const hour = new Date(t).getHours();
                    const car = firstDay && carUsed < carAllowance && hour >= 6 && hour < 19 && pv - loadWorst >= CAR_KW ? CAR_KW : 0;
                    carUsed += car * 0.5;
                    const stepWorst = batteryPct(pv - loadWorst - car, 0.5);
                    steps.push(stepWorst);
                    if (firstDay) {
                      typical += batteryPct(pv - loadAt(t) - car, 0.5);
                      worst += stepWorst;
                      low = Math.min(low, worst);
                    }
                  }
                  let need = 100;
                  for (const step of steps.reverse()) {
                    need = Math.min(Math.max(floor + 5, need - step), 100);
                  }
                  return Math.ceil(Math.min(Math.max(90 - typical, floor + 5 - low, need, floor), 100));
                };

                // Mirrors the AGL Battery Export to Target automation: tonight uses the captured or
                // live target, tomorrow evening the target the plan would capture then
                const exportEnabled =
                  hass.states['automation.electricity_zerohero_conditional_export']?.state === 'on' &&
                  hass.states['binary_sensor.solplanet_battery_al010k5sq2590170_schedule_configured']?.state === 'on';
                const windows = [0, 1].map((days) => ({
                  start: atHour(17, days),
                  end: atHour(21, days),
                  target: days === 0 ? num('sensor.battery_export_target', 100) : null,
                  from: null,
                  soc: null,
                  skipped: false,
                }));
                const sessionStart =
                  (hass.states['input_datetime.agl_export_session_start']?.attributes?.timestamp ?? 0) * 1000;
                if (exportEnabled && sessionStart >= windows[0].start && sessionStart <= now && now < windows[0].end) {
                  windows[0].from = sessionStart;
                  windows[0].soc = num('input_number.agl_export_start_soc', startSoc);
                  windows[0].target = num('input_number.agl_export_target_soc', 100);
                  // The automation only exports when the starting SOC is more than 2 points above the target
                  windows[0].skipped = windows[0].soc <= windows[0].target + 2;
                  if (windows[0].skipped) {
                    windows[0].from = null;
                  }
                }

                let soc = startSoc;
                const points = [[now, soc]];
                for (let t = now, dt; t < horizon; t += dt) {
                  // The first step is shortened so later steps land on 5-minute boundaries
                  dt = Math.min(STEP - (t % STEP), horizon - t);
                  const hours = dt / (60 * 60 * 1000);
                  for (const w of windows) {
                    if (exportEnabled && !w.skipped && w.from === null && t >= w.start && t < w.end) {
                      if (w.target === null) {
                        w.target = planTarget(w.end, carNeededKwh);
                      }
                      w.skipped = soc <= w.target + 2;
                      if (!w.skipped) {
                        w.from = t;
                        w.soc = soc;
                      }
                    }
                  }

                  const pv = solarAt(t);
                  const load = loadAt(t);
                  const hour = new Date(t).getHours();
                  const car = carNeededKwh > 0 && hour >= 6 && hour < 17 && pv - load >= CAR_KW ? CAR_KW : 0;
                  carNeededKwh -= car * hours;
                  let next = soc + batteryPct(pv - load - car, hours);

                  const active = windows.find((w) => w.from !== null && t >= w.from && t < w.end);
                  if (active) {
                    const progress = Math.min((t + dt - active.from) / (active.end - active.from), 1);
                    const target = Math.max(active.target, active.soc - (active.soc - active.target) * progress);
                    const fastest = soc - ((MAX_DISCHARGE_KW / EFFICIENCY) * hours / CAPACITY_KWH) * 100;
                    next = Math.min(next, Math.max(target, fastest));
                  }

                  soc = Math.min(Math.max(next, minSoc), maxSoc);
                  // Sparse points let the smooth curve round off the corners
                  if ((t + dt) % PLOT_EVERY === 0 || t + dt >= horizon) {
                    points.push([t + dt, Math.round(soc * 10) / 10]);
                  }
                }
                return points.filter(([timestamp]) =>
                  timestamp >= start.getTime() && timestamp <= end.getTime()
                );

      -
        type: horizontal-stack
        cards:
          -
            type: custom:button-card
            entity: input_number.solar_graph_offset
            icon: mdi:skip-previous
            name: Previous Day
            styles:
              card:
                - height: 5em
            tap_action:
              action: call-service
              service: input_number.set_value
              service_data:
                entity_id: input_number.solar_graph_offset
                value: |
                  [[[
                    return Math.min(
                      Number(entity.attributes.max),
                      Number(entity.state) + Number(entity.attributes.step)
                    );
                  ]]]
          -
            type: custom:button-card
            entity: input_number.solar_graph_offset
            icon: mdi:skip-next
            name: Next Day
            styles:
              card:
                - height: 5em
            tap_action:
              action: call-service
              service: input_number.set_value
              service_data:
                entity_id: input_number.solar_graph_offset
                value: |
                  [[[
                    return Math.max(
                      Number(entity.attributes.min),
                      Number(entity.state) - Number(entity.attributes.step)
                    );
                  ]]]

  -
    view_layout:
      grid-area: right
    type: vertical-stack
    cards:
      -
        type: custom:power-flow-card-plus
        clickable_entities: true
        min_expected_power: 500
        max_expected_power: 10000
        min_flow_rate: 1
        max_flow_rate: 4
        use_new_flow_rate_model: true
        kilo_decimals: 2
        kilo_threshold: 0
        entities:
          home:
            entity: sensor.home_power_consumption
            color_icon: true
            color_value: true
          grid:
            entity:
              consumption: sensor.grid_power_consumption
              production: sensor.grid_power_export
            color_icon: true
            display_state: one_way
            display_zero_tolerance: 50
            color_circle: true
            color:
              production: '#18cf87'
              consumption: '#f76354'
          solar:
            entity: sensor.total_solar_generation
            color_icon: true
            color_value: true
          battery:
            entity: sensor.solplanet_al010k5sq2590170_power
            state_of_charge: sensor.solplanet_battery_al010k5sq2590170_battery_state_of_charge
            color_icon: true
            display_state: one_way
          individual:
            - name: Car
              entity: sensor.garage_zeekr_7x_awd_charge_power
              icon: mdi:car-electric
              color_value: true
              display_zero: true
              secondary_info:
                entity: sensor.garage_zeekr_7x_awd_battery_level
                unit_of_measurement: "%"
                unit_white_space: false
                display_zero: true

      -
        type: entities
        entities:
          -
            type: custom:multiple-entity-row
            name: Electricity Bill Today ($)
            entity: sensor.electricity_costs_today_total
            unit: false
            format: precision2
          -
            type: section
          -
            type: custom:multiple-entity-row
            name: Solar Net Cost ($)
            entity: sensor.solar_net_cost
            unit: false
            format: precision2
          -
            type: custom:multiple-entity-row
            name: Solar Breakeven Date
            entity: sensor.solar_breakeven_date
          -
            type: section
          -
            type: custom:multiple-entity-row
            name: Battery Net Cost ($)
            entity: sensor.battery_net_cost
            unit: false
            format: precision2
          -
            type: custom:multiple-entity-row
            name: Battery Breakeven Date
            entity: sensor.battery_breakeven_date
