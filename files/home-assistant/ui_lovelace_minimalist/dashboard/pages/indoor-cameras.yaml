---

title: Indoor Cameras
path: indoor-cameras
icon: mdi:camera-wireless

# one combined go2rtc stream: the wall tablets run out of hardware decoders with six separate streams
type: panel

cards:
  - type: custom:webrtc-camera
    server: http://go2rtc:1984/
    streams:
      - url: indoor_mosaic
    background: false
    ui: true
    mode: webrtc,mse
    media: video
    poster: /local/camera-poster.jpg
    style: >-
      .screenshot {display: none}
      .pictureinpicture {display: none}
      .mode {display: none}
      video {max-height: calc(100vh - var(--header-height, 56px) - 16px)}
